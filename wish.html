<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --line: #5b4040; }

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    position: fixed; inset: 0; overflow: hidden;
  }
  body {
    display: grid; place-items: center;
    background: linear-gradient(160deg, #ffe9f2 0%, #ffcfe0 50%, #ffb6d1 100%);
  }

  #text {
    max-width: 88vw; text-align: center;
    font-family: "Pacifico", cursive; font-weight: 400;
    font-size: clamp(30px, 8vw, 64px); line-height: 1.35;
    color: var(--line);
    text-shadow: 0 2px 0 rgba(255, 255, 255, .7);
  }

  /* Words pop in quicker */
  #text span {
    display: inline-block;
    animation: wordIn .45s cubic-bezier(.3, 1.6, .5, 1) both;
  }
  @keyframes wordIn {
    from { transform: translateY(40px) scale(.7) rotate(-6deg); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  /* Text disappears fast */
  #text.out {
    transition: opacity .3s ease, transform .3s ease;
    opacity: 0; transform: translateY(-20px) scale(.95);
  }

  /* Page transition: fades into the video page's blue */
  #fade {
    position: fixed; inset: 0; z-index: 10; pointer-events: none;
    background: #58b6dc;
    opacity: 0; transition: opacity .8s ease;
  }
  body.leaving #fade { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { #text span { animation: none; } }
</style>
</head>

<body>
  <div id="text"></div>
  <div id="fade"></div>

<script>
  var lines = [
    "Now final wish ",
    "from someone special"
  ];
  var NEXT = "video.html";

  var box = document.getElementById('text');

  function show(i) {
    if (i >= lines.length) { leave(); return; }

    box.innerHTML = '';
    box.className = '';

    var words = lines[i].split(' ');
    words.forEach(function (w, k) {
      var s = document.createElement('span');
      s.textContent = w;
      s.style.animationDelay = (k * 0.12) + 's';
      box.appendChild(s);
      box.appendChild(document.createTextNode(' '));
    });

    var appear = words.length * 120 + 450;   // time for the words to pop in
    var hold = 900;                          // how long the line stays (was 1800)
    setTimeout(function () { box.className = 'out'; }, appear + hold);
    setTimeout(function () { show(i + 1); }, appear + hold + 350);
  }

  function leave() {
    document.body.classList.add('leaving');          // blue fade starts
    setTimeout(function () { window.location = NEXT; }, 900);
  }

  setTimeout(function () { show(0); }, 400);
</script>
</body>
</html>
